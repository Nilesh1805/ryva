  <!-- Interlocking R and V Monogram -->
  <g transform="translate(7.5, 7.5) scale(0.625)" stroke-linecap="round" stroke-linejoin="round">
    <!-- R Stem & Bowl -->
    <path d="M 6 4 L 6 36" stroke="#F5F0E8" stroke-width="3.2"/>
    <path d="M 6 4 C 18 4, 25 10, 25 18 C 25 25, 17 28, 6 28" fill="none" stroke="#F5F0E8" stroke-width="3.2"/>
    <!-- Interlocking Diagonal to V -->
